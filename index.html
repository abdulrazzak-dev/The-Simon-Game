<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simon Game</title>
<link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<h1>Simon Game</h1>
<div id="msg">Press any key or button to start</div>
<div class="board">
  <div id="green" class="pad green"></div>
  <div id="red" class="pad red"></div>
  <div id="yellow" class="pad yellow"></div>
  <div id="blue" class="pad blue"></div>
  <div class="center">SIMON</div>
</div>
<div class="controls">
  <button id="startBtn">Start Game</button>
  <span id="score">Score: 0</span>
</div>
<script src="javascripet.js"></script>
</body>
</html>
